services:
  - type: web
    name: markaz-ul-igathah
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma migrate deploy && npx prisma db seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: markaz-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYMENTS_DEMO_MODE # only used while PAYSTACK_SECRET_KEY is empty
        value: "true"
      - key: DEMO_MODE # set to "false" before launch
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: markaz-db
    plan: basic-256mb
